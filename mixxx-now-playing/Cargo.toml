[package]
name = "mixxx-now-playing"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
directories = "6"
lofty = "0.22"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "charset", "http2", "json", "native-tls", "system-proxy"] }
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"
toml = "1.0"

[dev-dependencies]
musicindex-live-publisher = { path = ".." }
tempfile = "3"
