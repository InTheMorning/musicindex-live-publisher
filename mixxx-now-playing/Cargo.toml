[package]
name = "mixxx-now-playing"
version = "0.1.0"
edition = "2024"

[dependencies]
now-playing-drop = { path = "../now-playing-drop" }
musicindex-tags = { git = "https://github.com/InTheMorning/musicindex-lib", rev = "fad5343849a7aad4eba2c0ba3232b8d851cacdfa" }
anyhow = "1"
directories = "6"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "charset", "http2", "json", "native-tls", "system-proxy"] }
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"
toml = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
musicindex-live-publisher = { path = ".." }
lofty = "0.22"
tempfile = "3"
now-playing-drop = { path = "../now-playing-drop", features = ["test-server"] }
