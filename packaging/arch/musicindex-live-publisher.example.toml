# The Mixxx publisher instance overrides watch_dir with:
#   --watch-dir %t/musicindex-live-publisher/mixxx/nowplaying
# Keep this value for foreground runs outside systemd.
watch_dir = "/run/user/1000/musicindex-live-publisher/mixxx/nowplaying"
endpoint = "https://api.musicindex.org"

[[target]]
name = "default"
event_id = "replace-with-provisioned-event-guid"

# One token file per target. The provision command writes this file with mode
# 0600. The publisher also accepts %d/<credential> when run by a custom unit
# that sets CREDENTIALS_DIRECTORY.
token_file = "~/.config/musicindex-live-publisher/mixxx/tokens/default.token"

# The delay, in seconds, that a podcast app gets on Socket.IO
# (musicindex-live-relay ADR 0004). The relay applies this value. The
# publisher sends it with each publish and does not wait (ADR 0011). Measure
# it against a real Socket.IO client rather than copying butt's song-update
# delay, which is a different term. Maximum 300.
# stream_delay_secs = 0

# The publisher uses a fixed dead block while idle or non-V4V (ADR 0005).
# No configuration changes it.
