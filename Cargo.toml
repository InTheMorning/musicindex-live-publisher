[package]
name = "musicindex-live-publisher"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"

[dependencies]
anyhow = "1"
musicindex-build-info = { git = "https://github.com/InTheMorning/musicindex-lib", rev = "e6d11118d33069c26c01368f7de71524988039c6" }
notify = "8"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "charset", "http2", "json", "native-tls", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.10", default-features = false }
toml = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[build-dependencies]
musicindex-build-info = { git = "https://github.com/InTheMorning/musicindex-lib", rev = "e6d11118d33069c26c01368f7de71524988039c6" }

[dev-dependencies]
tempfile = "3"

# ADR 0019: cargo-deb makes the .deb from these assets. The release workflow
# builds the three binaries of the workspace in one cargo build, and then runs
# `cargo deb --no-build`. Keep the asset list the same as package() of
# packaging/arch/PKGBUILD.
[package.metadata.deb]
maintainer = "HeyCitizen <4637290+InTheMorning@users.noreply.github.com>"
copyright = "HeyCitizen"
license-file = ["LICENSE", "0"]
extended-description = "Publishes the now-playing track as MusicIndex live value updates, with the mixxx-now-playing and liquidsoap-now-playing producers, the user systemd units, the Mixxx MIDI connector mapping and the Liquidsoap slot text."
section = "sound"
priority = "optional"
depends = "$auto, bash, ca-certificates, systemd"
recommends = "mixxx"
assets = [
    ["target/release/musicindex-live-publisher", "usr/bin/", "755"],
    ["target/release/mixxx-now-playing", "usr/bin/", "755"],
    ["target/release/liquidsoap-now-playing", "usr/bin/", "755"],
    ["scripts/setup-mixxx-musicindex.sh", "usr/bin/setup-mixxx-musicindex", "755"],
    ["systemd/musicindex-live-publisher.service", "usr/lib/systemd/user/", "644"],
    ["systemd/musicindex-live-publisher@.service", "usr/lib/systemd/user/", "644"],
    ["systemd/mixxx-now-playing@.service", "usr/lib/systemd/user/", "644"],
    ["systemd/liquidsoap-now-playing@.service", "usr/lib/systemd/user/", "644"],
    ["packaging/midi/musicindex-v4v-midi.modules-load.conf", "usr/lib/modules-load.d/musicindex-v4v-midi.conf", "644"],
    ["packaging/midi/musicindex-v4v-midi.modprobe.conf", "usr/lib/modprobe.d/musicindex-v4v-midi.conf", "644"],
    ["mixxx/MusicIndex-V4V-Connector.midi.xml", "usr/share/mixxx/controllers/", "644"],
    ["mixxx/MusicIndex-V4V-Connector.js", "usr/share/mixxx/controllers/", "644"],
    ["packaging/arch/musicindex-live-publisher.example.toml", "usr/share/doc/musicindex-live-publisher/examples/config.toml", "644"],
    ["packaging/arch/hitit.example.toml", "usr/share/doc/musicindex-live-publisher/examples/hitit-config.toml", "644"],
    ["README.md", "usr/share/doc/musicindex-live-publisher/", "644"],
    ["docs/runbooks/musicindex-live-publisher-deploy.md", "usr/share/doc/musicindex-live-publisher/", "644"],
    ["docs/runbooks/musicindex-live-publisher-configuration.md", "usr/share/doc/musicindex-live-publisher/", "644"],
    ["docs/runbooks/liquidsoap-now-playing-azuracast.md", "usr/share/doc/musicindex-live-publisher/", "644"],
    ["liquidsoap/musicindex-state.liq", "usr/share/doc/musicindex-live-publisher/liquidsoap/", "644"],
]

[workspace]
members = ["mixxx-now-playing", "now-playing-drop", "liquidsoap-now-playing", "station-import"]
default-members = [".", "mixxx-now-playing", "now-playing-drop", "liquidsoap-now-playing", "station-import"]
resolver = "3"
