[package]
name = "musicindex-live-publisher"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
notify = "8"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "charset", "http2", "json", "native-tls", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
