[package]
name = "station-import"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"

[[bin]]
name = "station-import"
path = "src/main.rs"

[dependencies]
anyhow = "1"
musicindex-fetch = { git = "https://github.com/InTheMorning/musicindex-lib", rev = "5db5c807bdd6808b52dd2ca5a1d805651dbe0b5a" }
musicindex-tags = { git = "https://github.com/InTheMorning/musicindex-lib", rev = "5db5c807bdd6808b52dd2ca5a1d805651dbe0b5a" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
