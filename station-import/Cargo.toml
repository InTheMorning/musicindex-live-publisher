[package]
name = "station-import"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"

[[bin]]
name = "station-import"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
musicindex-fetch = { git = "https://github.com/InTheMorning/musicindex-lib", rev = "cd21d45aa50692d873ef12edc5c31f7cb039a1b0" }
musicindex-convert = { git = "https://github.com/InTheMorning/musicindex-lib", rev = "cd21d45aa50692d873ef12edc5c31f7cb039a1b0" }
musicindex-tags = { git = "https://github.com/InTheMorning/musicindex-lib", rev = "cd21d45aa50692d873ef12edc5c31f7cb039a1b0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
tempfile = "3"
