[package]
name = "station-import"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"

[[bin]]
name = "station-import"
path = "src/main.rs"

[dependencies]
anyhow = "1"
musicindex-fetch = { git = "https://github.com/InTheMorning/musicindex-lib", rev = "babdd863f23723ad8bba439253a29e9758871ea2" }
musicindex-tags = { git = "https://github.com/InTheMorning/musicindex-lib", rev = "babdd863f23723ad8bba439253a29e9758871ea2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
