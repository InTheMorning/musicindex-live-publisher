[package]
name = "liquidsoap-now-playing"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"

[dependencies]
anyhow = "1"
directories = "6"
display-keys = { path = "../display-keys" }
now-playing-drop = { path = "../now-playing-drop" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
tempfile = "3"
now-playing-drop = { path = "../now-playing-drop", features = ["test-server"] }
